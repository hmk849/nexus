name: Build NEXUS (unsigned IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26          # 需要 Xcode 26+ SDK（Swift 6 + iOS 26 API）
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          BEST=""; BEST_VER=0
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist" 2>/dev/null || echo 0)
            NUM=$(echo "$V" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            if [ "$NUM" -gt "$BEST_VER" ]; then BEST_VER=$NUM; BEST="$APP"; fi
          done
          echo "Using $BEST (Xcode $V)"
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project NEXUS.xcodeproj -scheme NEXUS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/NEXUS.app Payload/
          zip -qr NEXUS-unsigned.ipa Payload
      - name: Verify IPA
        run: |
          python3 -c "
          import plistlib, zipfile, sys
          z = zipfile.ZipFile('NEXUS-unsigned.ipa')
          names = [n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist')]
          assert len(names) == 1, names
          d = plistlib.loads(z.read(names[0]))
          for k in ['CFBundleExecutable', 'CFBundleIdentifier', 'CFBundleShortVersionString', 'MinimumOSVersion']:
              print(k, '=', d.get(k))
              assert d.get(k), k
          app = names[0][:-len('Info.plist')]
          assert app + d['CFBundleExecutable'] in z.namelist(), 'missing executable'
          print('IPA OK')
          "
      - uses: actions/upload-artifact@v4
        with: { name: NEXUS-unsigned-ipa, path: NEXUS-unsigned.ipa }
